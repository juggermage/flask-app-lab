{% extends 'base.html' %}

{% block content %}
<h1 class="mb-4">{{ title }}</h1>

<div class="row g-5">
    <section class="col-lg-5" aria-labelledby="info-title">
        <h2 id="info-title" class="h4">Контактна інформація</h2>
        <address class="mt-3">
            <p><strong>Email:</strong> <a href="mailto:{{ contacts.email }}">{{ contacts.email }}</a></p>
            <p><strong>Телефон:</strong> <a href="tel:{{ contacts.phone|replace(' ', '') }}">{{ contacts.phone }}</a></p>
            <p><strong>Місто:</strong> {{ contacts.city }}</p>
            <p><strong>GitHub:</strong> <a href="{{ contacts.github }}" target="_blank" rel="noopener">{{ contacts.github }}</a></p>
        </address>
    </section>

    <section class="col-lg-7" aria-labelledby="form-title">
        <h2 id="form-title" class="h4">Надішліть повідомлення</h2>
        <!-- Форма-заглушка: реальної відправки немає -->
        <form method="post" action="{{ url_for('contacts') }}" class="mt-3">
            <div class="mb-3">
                <label for="name" class="form-label">Ім'я</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="message" class="form-label">Повідомлення</label>
                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-accent">Надіслати</button>
        </form>
    </section>
</div>
{% endblock %}
