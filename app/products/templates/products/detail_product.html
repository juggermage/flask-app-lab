{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<nav aria-label="breadcrumb">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{{ url_for('products.product_list') }}">Товари</a></li>
        <li class="breadcrumb-item active" aria-current="page">{{ product.name }}</li>
    </ol>
</nav>

<article class="card product-card">
    <div class="card-body">
        <h1 class="h2 card-title">{{ product.name }}</h1>
        <p class="text-muted small mb-2">ID товару: {{ product.id }}</p>
        <p class="card-text">{{ product.content }}</p>
        <p class="product-price fs-4 mb-4">{{ product.price }} $</p>
        <a href="{{ url_for('products.product_list') }}" class="btn btn-outline-secondary">&larr; Назад до списку</a>
    </div>
</article>
{% endblock %}
