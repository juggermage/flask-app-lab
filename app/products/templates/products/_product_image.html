{# Мініатюра товару або заглушка, якщо зображення немає. Параметр: css_class #}
{% set image_url = product_image_url(product) %}
{% if image_url %}
    <img src="{{ image_url }}" alt="{{ product.name }}" class="{{ css_class }}">
{% else %}
    <div class="product-image-placeholder {{ css_class }}">Немає зображення</div>
{% endif %}
