{% extends 'base.html' %}
{% block content %}
<h1>Список користувачів ({{ users|length }})</h1>
{% if users %}
<table class="table table-striped"><thead><tr><th>ID</th><th>Username</th><th>Email</th></tr></thead><tbody>
{% for user in users %}<tr><td>{{ user.id }}</td><td>{{ user.username }}</td><td>{{ user.email }}</td></tr>{% endfor %}
</tbody></table>
{% else %}<p>Зареєстрованих користувачів немає.</p>{% endif %}
{% endblock %}
